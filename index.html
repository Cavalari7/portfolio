or-Cavalari.pdf"},"info":{"nome":"Igor Emanoel Cavalari da Silva","nasc":"24/12/2005","nat":"Cianorte – PR, Brasil","loc":"Vidigal, Cianorte – PR","form":"Análise e Desenvolvimento de Sistemas – UNIPAR (cursando)","idi":"Português","cnh":"Categorias A e B"},"bio":{"historia":"Nasci em Cianorte, no Paraná, em 2005. Sou movido por curiosidade: gosto de entender como as coisas funcionam por dentro e, principalmente, de construir coisas que funcionem bem por fora. Meu interesse por tecnologia começou como curiosidade e virou rotina — hoje passo boa parte do tempo estudando lógica, bancos de dados e as engrenagens que sustentam a web.\n\nDesenvolvimento web é onde encontro o equilíbrio entre lógica e criatividade: cada projeto é um quebra-cabeça técnico e, ao mesmo tempo, uma oportunidade de criar algo visualmente interessante para quem usa. Ainda estou no começo dessa jornada, mas é exatamente esse processo de evolução constante que me motiva.","formacao":"Análise e Desenvolvimento de Sistemas — Universidade Paranaense (UNIPAR), desde 2025 (cursando)\nEnsino Fundamental e Médio completo (2010–2023) — Escola João Bueno de Godoy e Colégio Estadual de Vidigal","experiencia":"Auxiliar Administrativo – Jovem Aprendiz — Companhia Melhoramentos Norte do Paraná (2025–2026): digitalização e organização de contratos no setor imobiliário e pré-recebimento de notas no setor fiscal, com o sistema TOTVS Datasul\nAuxiliar de Produção – Jovem Aprendiz — Avenorte Group (2024–2025): embalagem de produtos para expedição no setor de Secundária","habilidades":"Linguagens: HTML, CSS, JavaScript e SQL (nível intermediário)\nFerramenta: TOTVS Datasul\nBoa comunicação verbal e escrita\nAdaptação rápida em diversas áreas\nTrabalho em equipe e capacidade de aprender rapidamente","objetivos":"Crescer como desenvolvedor full-stack, participar de projetos reais e transformar ideias — minhas e de outras pessoas — em soluções digitais que realmente façam sentido.","conquistas":"Contrato de Jovem Apren const hero=()=>`<section class="hero" id="home"><div class="wrap hg"><div>${S.logo?`<div class="lg"><img src="${esc(S.logo)}" alt="Logotipo completo IC Igor Cavalari" width="760" height="549"></div>`:''}<p class="role" ${ce('role','Sua área de atuação')}>${esc(S.role)}</p><h1 ${ce('name','Nome completo')}>${edit?esc(S.name):S.name.split(' ').map((w,i)=>`<span class="wd" style="--i:${i}">${esc(w)}</span>`).join(' ')}</h1><p class="tag" ${ce('tagline','Frase de apresentação')}>${esc(S.tagline)}</p><p class="sum" ${ce('summary','Breve resumo profissional')}>${esc(S.summary)}</p><div class="cta"><a class="btn" href="#projetos">Ver projetos</a><a class="btn o" href="#curriculo">Currículo</a><a class="btn o" href="#contato">Contato</a></div></div><div class="hs"><div class="ph"><div class="ti"><i class="o o1"></i><i class="o o2"></i><img src="${esc(S.photo)}" alt="Retrato de ${esc(S.name)}" width="560" height="560"></div>${edit?'<label class="btn s phb">Trocar foto<input type="file" accept="image/*" data-up="photo" hidden></label>':''}</div>${cvBox()}</div></div></section>`;

const body=(k,t)=>{const v=S.bio[k]||'';if(edit)return `<p ${ce('bio.'+k,t==='l'?'Uma linha por item…':'Escreva aqui…')}>${esc(v)}</p>`;const ls=v.split('\n').map(x=>x.trim()).filter(Boolean);return t==='l'?`<ul>${ls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:ls.map(x=>`<p>${esc(x)}</p>`).join('')};
const about=()=>`<section class="s" id="sobre"><div class="wrap"><h2>Sobre mim</h2><p class="lede">Quem sou, de onde venho e o que busco.</p><dl class="inf">${[['Nome completo','nome'],['Data de nascimento','nasc'],['Naturalidade','nat'],['Residência','loc'],['Formação atual','form'],['Idioma','idi'],['Habilitação','cnh']].filter(([,k])=>edit||S.info[k]).map(([l,k])=>`<div><dt>${l}</dt><dd ${ce('info.'+k,l)}>${esc(S.info[k])}</dd></div>`).join('')}</dl><div class="bg">${BL.filter(([k])=>edit||S.bio[k]).map(([k,l,t])=>`<article class="c bb${k==='historia'?' w':''}"><h3>${l}</h3>${body(k,t)}</article>`).join('')}</div></div></section>`;
const trail=()=>`<section class="s" id="trajetoria"><div class="wrap"><h2>Trajetória</h2><p class="lede">Formação, cursos, certificações, experiências e conquistas ao longo do caminho.</p><ol class="tl">${S.timeline.map((t,i)=>`<li><div class="w" ${ce(`timeline.${i}.period`,'Período')}>${esc(t.period)}</div><div class="c">${del('timeline.'+i)}<p class="m" ${ce(`timeline.${i}.type`,'Tipo: curso, certificação, experiência…')}>${esc(t.type)}</p><h3 ${ce(`timeline.${i}.title`,'Título')}>${esc(t.title)}</h3>${edit||t.org?`<p ${ce(`timeline.${i}.org`,'Instituição ou empresa')}>${esc(t.org)}</p>`:''}${edit||t.desc?`<p ${ce(`timeline.${i}.desc`,'Descrição')}>${esc(t.desc)}</p>`:''}</div></li>`).join('')}</ol>${add('timeline','Adicionar à trajetória')}</div></section>`;
const projs=()=>`<section class="s" id="projetos"><div class="wrap"><h2>Projetos</h2><p class="lede">Trabalhos acadêmicos e pessoais onde coloco em prática o que venho aprendendo.</p><div class="pg">${S.projects.map((p,i)=>{const L=U('',p.link),G=U('',p.git);return `<article class="c pc">${del('projects.'+i)}<div class="cov"${p.bg?` style="background:${esc(p.bg)}"`:''}>${p.img?`<img src="${esc(p.img)}" alt="Capa do projeto ${esc(p.title)}" loading="lazy">`:esc((p.title||'?')[0])}${edit||p.per?`<span class="bd" ${ce(`projects.${i}.per`,'Período ou status')}>${esc(p.per)}</span>`:''}${edit?`<label class="btn s phb" style="position:absolute;left:10px;top:10px">Capa<input type="file" accept="image/*" data-up="projects.${i}.img" hidden></label>`:''}</div><div class="in"><p class="m" ${ce(`projects.${i}.tag`,'Categoria')}>${esc(p.tag)}</p><h3 ${ce(`projects.${i}.title`,'Nome do projeto')}>${esc(p.title)}</h3>${edit||p.part?`<p class="m" ${ce(`projects.${i}.part`,'Participação (ex.: Trabalho em grupo)')}>${esc(p.part)}</p>`:''}<p ${ce(`projects.${i}.desc`,'Descrição')}>${esc(p.desc)}</p>${edit?`<p class="lf">Tecnologias (separe por vírgula)</p><p class="lf" ${ce(`projects.${i}.stack`,'HTML, CSS, JS')}>${esc(p.stack)}</p>`:!p.stack.trim()?'':`<div class="ch">${p.stack.split(',').map(s=>s.trim()).filter(Boolean).map(s=>`<span>${esc(s)}</span>`).join('')}</div>`}${edit?`<p class="lf">Link do projeto</p><p class="lf" ${ce(`projects.${i}.link`,'https://…')}>${esc(p.link)}</p><p class="lf">GitHub</p><p class="lf" ${ce(`projects.${i}.git`,'https://github.com/…')}>${esc(p.git)}</p>`:`<div class="lk">${L?`<a class="btn s" href="${esc(L)}" target="_blank" rel="noopener">Acessar projeto ↗</a>`:''}${G?`<a class="btn s o" href="${esc(G)}" target="_blank" rel="noopener">GitHub ↗</a>`:''}</div>`}</div></article>`}).join('')}</div>${add('projects','Adicionar projeto')}</div></section>`;
const skills=()=>`<section class="s" id="habilidades"><div class="wrap"><h2>Habilidades</h2><p class="lede">Ferramentas e conhecimentos que uso para transformar lógica em interface — e dados em estrutura.</p><div class="sg">${S.skills.map((g,i)=>`<div class="c sk">${del('skills.'+i)}<svg viewBox="0 0 24 24" aria-hidden="true">${IC[i%3]}</svg><h3 ${ce(`skills.${i}.cat`,'Categoria')}>${esc(g.cat)}</h3><ul>${g.items.map((it,j)=>`<li>${edit?`<button class="x" style="top:6px;right:0;width:22px;height:22px" data-del="skills.${i}.items.${j}" aria-label="Remover">×</button>`:''}<b ${ce(`skills.${i}.items.${j}.n`,'Habilidade')}>${esc(it.n)}</b><span ${ce(`skills.${i}.items.${j}.d`,'Descrição curta')}>${esc(it.d)}</span></li>`).join('')}</ul>${add(`skills.${i}.items`,'Habilidade')}</div>`).join('')}</div>${add('skills','Categoria')}</div></section>`;
const contact=()=>{const em=U('mail',S.links.find(l=>/mail/i.test(l.k))?.v);return `<section class="s" id="contato"><div class="wrap ct"><div><h2>Vamos conversar?</h2><p class="lede">Se você tem uma oportunidade, um projeto ou uma ideia, será um prazer conversar.</p>${S.links.map((l,i)=>{const h=U(l.k,l.v);if(!edit&&!h)return'';return edit?`<div class="ll">${del('links.'+i)}<span class="m" ${ce(`links.${i}.k`,'Rede')}>${esc(l.k)}</span><span class="v" ${ce(`links.${i}.v`,'Endereço ou número')}>${esc(l.v)}</span></div>`:`<a class="ll" href="${esc(h)}" ${/mail/i.test(l.k)?'':'target="_blank" rel="noopener"'}><span class="m">${esc(l.k)}</span><span class="v">${esc(l.v.replace(/^https?:\/\/(www\.)?/,''))} ↗</span></a>`}).join('')}${add('links','Adicionar link')}</div>${em?`<form id="cf"><label>Nome<input name="name" required autocomplete="name"></label><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Mensagem<textarea name="message" rows="5" required></textarea></label><input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="btn" type="submit">Enviar mensagem</button><p class="m" id="fs" role="status" aria-live="polite"></p></form>`:''}</div></section>`};
const foot=()=>`<footer><div class="wrap">© ${new Date().getFullYear()} ${esc(S.name)} · Cianorte, PR</div></footer>`;
const bar=()=>!can?'':`<div class="tb">${edit?`<button class="btn s" data-sv>Salvar e publicar</button><button class="btn s o" data-ex>Descartar</button>`:`<button class="btn s" data-ed>✎ Editar portfólio</button>`}<span id="st">${esc(st)}</span></div>`;
function R(){document.body.classList.toggle('ed',edit);$('#app').innerHTML=nav()+'<main>'+hero()+about()+trail()+projs()+skills()+contact()+'</main>'+foot()+bar();fx()}
const say=t=>{st=t;const e=$('#st');if(e)e.textContent=t};

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)setv(k,e.target.innerText.replace(/\n$/,''))});
document.addEventListener('submit',async e=>{if(e.target.id!=='cf')return;e.preventDefault();const f=e.target,b=f.querySelector('button'),o=$('#fs'),d=new FormData(f);b.disabled=true;o.textContent='Enviando…';
 try{const r=await fetch('https://formspree.io/f/xljbjene',{method:'POST',body:d,headers:{Accept:'application/json'}});if(!r.ok)throw 0;f.reset();o.textContent='Mensagem enviada! Obrigado pelo contato.'}
 catch(x){o.textContent='Não foi possível enviar agora. Abrindo seu aplicativo de e-mail…';const to=U('mail',S.links.find(l=>/mail/i.test(l.k)).v);location.href=to+'?subject='+encodeURIComponent('Contato via portfólio — '+d.get('name'))+'&body='+encodeURIComponent(d.get('message')+'\n\n'+d.get('name')+' ('+d.get('email')+')')}
 b.disabled=false});
document.addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0],t=e.target.dataset&&e.target.dataset.up;if(!f||!t)return;const as=await use('assets');if(!as)return say('Upload indisponível nesta visualização.');say('Enviando…');try{const r=await as.upload(f);t==='cv'?S.cv={name:f.name,url:r.url}:setv(t,r.url);say('Arquivo enviado. Lembre-se de salvar.');R()}catch(x){say('Falha no envio do arquivo.')}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-t],[data-del],[data-add],[data-dl],[data-ed],[data-ex],[data-sv]');if(!t)return;const d=t.dataset;
 if('t'in d){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(x){}}
 else if(d.del){const k=d.del.split('.'),i=+k.pop();getr(k.join('.')).splice(i,1);R()}
 else if(d.add){const k=d.add.split('.');getr(d.add).push(T[k[k.length-1]]());R()}
 else if('dl'in d){try{const b=await(await fetch(S.cv.url)).blob(),dl=await use('downloads');if(!dl)throw 0;await dl.save({filename:S.cv.name,data:b})}catch(x){window.open(S.cv.url,'_blank')}}
 else if('ed'in d){edit=true;say('');R()}
 else if('ex'in d){location.reload()}
 else if('sv'in d){const a=await use('artifact');if(!a)return say('Salvar indisponível aqui.');say('Publicando…');const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.removeAttribute('data-theme');c.querySelector('body').removeAttribute('class');try{await a.publish('<!doctype html>\n'+c.outerHTML)}catch(x){say(x&&x.code==='conflict'?'Há uma versão mais recente; recarregando.':'Não foi possível salvar.')}}});
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,FP=matchMedia('(hover:hover) and (pointer:fine)').matches;
let io,so,tk=0;
function fx(){io&&io.disconnect();so&&so.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
 document.querySelectorAll('.s h2,.s .lede,.c,.tl li,.ll,.inf div,form').forEach((e,i)=>{e.classList.add('rv');e.style.setProperty('--dl',(i%3)*.08+'s');io.observe(e)});
 so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.nv a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
 document.querySelectorAll('main section[id]').forEach(x=>so.observe(x))}
addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const r=document.documentElement,y=scrollY;r.style.setProperty('--sy',y);r.style.setProperty('--p',Math.min(1,y/((r.scrollHeight-innerHeight)||1)))})},{passive:true});
if(FP&&!RM){document.addEventListener('mousemove',e=>{const t=$('.ph .ti');if(t){t.style.setProperty('--ry',(e.clientX/innerWidth-.5)*14+'deg');t.style.setProperty('--rx',-(e.clientY/innerHeight-.5)*14+'deg')}const c=e.target.closest&&e.target.closest('.pc');if(c&&!edit){const b=c.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;c.style.setProperty('--ry',(px-.5)*8+'deg');c.style.setProperty('--rx',(.5-py)*8+'deg');c.style.setProperty('--mx',px*100+'%');c.style.setProperty('--my',py*100+'%')}});
 document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.pc');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--ry','0deg');c.style.setProperty('--rx','0deg')}})}
document.addEventListener('click',e=>{const h=$('header');if(!h)return;const m=e.target.closest('[data-m]');if(m){h.classList.toggle('open');m.setAttribute('aria-expanded',h.classList.contains('open'))}else if(e.target.closest('.nv a'))h.classList.remove('open')});
(function(){const c=$('#pt');if(!c||RM)return;const x=c.getContext('2d');let W,H,raf;const P=[],n=innerWidth<700?22:46;
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
 for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.4,v:Math.random()*.25+.05,a:Math.random()*.5+.2});
 const d=()=>{x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fillStyle='rgba(138,160,255,'+p.a+')';x.fill()}raf=requestAnimationFrame(d)};
 d();document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)d()})})();
let th=null;try{th=localStorage.getItem('th')}catch(x){}document.documentElement.dataset.theme=th||'dark';
R();
use('user').then(u=>{if(u&&(u.isOwner()||u.canEdit())){can=true;R()}});
</script>
